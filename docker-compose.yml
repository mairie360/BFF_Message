volumes:
  redis-data:

secrets:
  npmrc:
    file: ./.npmrc
  node_auth_token:
    environment: NODE_AUTH_TOKEN

networks:
  backend:
  user_backend:
    external: true
    name: ${USER_BACKEND_NETWORK:-bff_user_backend}

x-common-env: &common-env
  HOST: "0.0.0.0"
  PORT: 4003

x-depends-on: &depends-on
  redis:
    condition: service_healthy

services:
  redis:
    image: redis:8.4.0-bookworm@sha256:c22af04bb576503bf16b3e34a1fd2fd82de0f765afd866d2e380145e0af30d78
    container_name: mairie360-redis-message-bff #change bff name
    restart: always
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message-api:
    container_name: message-api-bff-message-developpement
    image: ghcr.io/mairie360/message-api:dev-b71b66c
    ports:
      - "3003:3003"
    networks:
      - backend
      - user_backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      HOST: "0.0.0.0"
      PORT: 3003
      REDIS_URL: redis://redis:6379
      DB_TYPE: postgres
      DB_NAME: mairie_360_database
      DB_USER: postgres
      DB_HOST: ${SHARED_DB_HOST:-postgres}
      DB_PASSWORD: password
      DB_PORT: 5432
      PUBLIC_URL: http://message.development.mairie360.fr
      # mairie360_api_lib >= 2.0 refuses the well-known b"secret" without this flag. Local dev stack
      # only: a deployment uses a random secret of at least 32 bytes (MAIR-428).
      JWT_ALLOW_WEAK_SECRET: "true"
      JWT_SECRET: b"secret"
      # MAIR-680: the public key of the Core that signs this stack's sessions (local or remote), from the
      # shell (`source ./stack_secrets.sh` gives a pair only for a Core started here with it); JWT_SECRET
      # is the HS256 transition of the dev stack only.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
      JWT_TIMEOUT: 3600
    depends_on:
      <<: *depends-on

  bff-message:
    container_name: bff-message-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      secrets:
        - npmrc
        - node_auth_token
    # Mode synchronisation en temps réel (Docker Compose V2)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    ports:
      - "4003:4003"
    networks:
      - backend
      - user_backend
    environment:
      <<: *common-env
      # Upstreams are reached through their Docker service names (<SERVICE>_URL + optional _PORT).
      MESSAGE_API_URL: "message-api"
      MESSAGE_API_PORT: 3003
      # The agents directory comes from Core API, served by the BFF User stack.
      CORE_API_URL: ${CORE_API_HOST:-core-api}
      CORE_API_PORT: ${CORE_API_PORT:-3000}
      # Business references: BFF Project and BFF Calendar, run from their own repositories on the host.
      # The APIs, never another BFF (MAIR-525).
      PROJECT_API_URL: ${PROJECT_API_URL:-http://host.docker.internal:3001}
      CALENDAR_API_URL: ${CALENDAR_API_URL:-http://host.docker.internal:3002}
      # Same development secret as the APIs of the local stacks: the BFF verifies the session tokens with it
      # (bffs-lib requireSession, MAIR-474) and refuses to start without it.
      JWT_SECRET: b"secret"
      # MAIR-680: the public key of the Core that signs this stack's sessions (local or remote), from the
      # shell (`source ./stack_secrets.sh` gives a pair only for a Core started here with it); JWT_SECRET
      # is the HS256 transition of the dev stack only.
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - /app/node_modules # Isolation des modules pour éviter les conflits OS (Mac/Windows vs Linux)
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 3
