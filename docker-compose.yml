    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3000/health"] # <--- Doit être 3000
    #   interval: 5s
    #   timeout: 2s
    #   retries: 3
    #   start_period: 10s

  message-api:
    container_name: message-api-bff-message-developpement
    image: ghcr.io/mairie360/message-api:dev-c8dfe39
    ports:
      - "3003:3003"
    networks:
      - backend
    dns:
      - 8.8.8.8
      - 1.1.1.1
    environment:
      HOST: "0.0.0.0"
      PORT: 3003
      REDIS_URL: redis://redis:6379
      DB_TYPE: postgres
      DB_NAME: mairie_360_database
      DB_USER: postgres
      DB_HOST: postgres
      DB_PASSWORD: password
      DB_PORT: 5432
      PUBLIC_URL: http://message.development.mairie360.fr
      JWT_SECRET: b"secret"
      JWT_TIMEOUT: 3600
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    # healthcheck:
    #   test: ["CMD", "curl", "-f", "http://localhost:3003/health"] # <--- Doit être 3003
    #   interval: 5s
    #   timeout: 2s
    #   retries: 3
    #   start_period: 10s

  #add other apis if needed

  bff-message:
    container_name: bff-message-developpement
    build:
      context: .
      dockerfile: development.Dockerfile
      args:
        - NODE_AUTH_TOKEN=${NODE_AUTH_TOKEN}
    # Mode synchronisation en temps réel (Docker Compose V2)
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
    ports:
      - "4003:4003"
    networks:
      - backend
    environment:
      <<: *common-env
      # IMPORTANT : On utilise le nom du service Docker pour communiquer
      CORE_API_URL: "core"
      CORE_API_PORT: 3000
      MESSAGE_API_URL: "message-api"
      MESSAGE_API_PORT: 3003
      MESSAGE_API_BASE_PATH: "message-api:3003"
    volumes:
      - /app/node_modules # Isolation des modules pour éviter les conflits OS (Mac/Windows vs Linux)
    # depends_on:
    # core:
    #   condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 3

