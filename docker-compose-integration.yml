# Integration test stack of the BFF Message (MAIR-262): the same upstream services as the ZAP / k6
# stacks (published Message API and Core API images, seeded database, Redis) plus a `newman` runner that
# replays the committed Postman collection (tests/postman/) against the BFF over the compose network.
#
#   ./integration_test.sh                   (local: builds bff-message:local from development.Dockerfile)
#   IMAGE_REF=<image> ./integration_test.sh (CI: the dev-<sha> image published by release-dev)
#
# The BFF under test is never built by this file: it runs the image named by IMAGE_REF, the one
# promote-staging tests and then promotes by digest. `--bail` stops at the first failing request;
# the exit code of the newman service is what integration_test.sh returns.

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:3.3.0}
    container_name: bff-message-int-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:3.3.0}
    container_name: bff-message-int-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-message-int-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-message-int-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message-api:
    image: ${MESSAGE_API_IMAGE:-ghcr.io/mairie360/message-api:2.1.0}
    container_name: bff-message-int-message-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the collection hammers it as two users.
      RATE_LIMIT_PER_SECOND: "0"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3003
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://message-api:3003
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3003"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): its readiness is probed
    # from the message-api-ready container below.

  message-api-ready:
    image: curlimages/curl:latest
    container_name: bff-message-int-message-api-ready
    depends_on:
      message-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://message-api:3003/health >/dev/null; do
      echo "waiting for message-api..."; sleep 2; done; echo "message-api ready"'
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: bff-message-int-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the collection hammers it as two users.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): its readiness is probed
    # from the core-api-ready container below.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-message-int-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    command: >
      sh -c 'until curl -fsS http://core-api:3000/health >/dev/null; do
      echo "waiting for core-api..."; sleep 2; done; echo "core-api ready"'
    networks:
      - backend

  bff-message:
    image: ${IMAGE_REF:-bff-message:local}
    container_name: bff-message-int-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      message-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4003
      MESSAGE_API_URL: message-api
      MESSAGE_API_PORT: 3003
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      # Required at start-up (no localhost default). Project API and Calendar API are not part of this
      # stack: GET /business-references answers 200 with both sources `unavailable`. They point at a closed
      # local port, refused at once: an unknown host name would stall every call on DNS resolution.
      PROJECT_API_URL: http://127.0.0.1:9
      CALENDAR_API_URL: http://127.0.0.1:9
      # GET /stream (MAIR-525) ends after 1 s here, so that newman gets a complete answer.
      MESSAGE_STREAM_MAX_MS: "1000"
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4003"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  # Replays tests/postman/collection.json against the `bff-message` service. `baseUrl` and the JWT_SECRET of
  # the run are injected here so the committed environment stays usable from a host shell; --working-dir is
  # where newman reads the attachment fixture (tests/postman/newman-attachment.txt) from. GET /stream ends
  # after MESSAGE_STREAM_MAX_MS (1 s); --timeout-request fails a request that hangs instead of blocking CI.
  # The reports (junit) land in ./newman-reports (gitignored), read by the CI job summary.
  newman:
    image: postman/newman:6.1.3-alpine
    container_name: bff-message-int-newman
    depends_on:
      bff-message:
        condition: service_healthy
    volumes:
      - ./tests/postman:/etc/newman:ro
      - ./newman-reports:/reports
    command: >
      run /etc/newman/collection.json
      --environment /etc/newman/environment.json
      --working-dir /etc/newman
      --env-var baseUrl=http://bff-message:4003
      --env-var jwt_secret=${JWT_SECRET}
      --timeout-request 30000
      --bail
      --reporters cli,junit
      --reporter-junit-export /reports/newman.xml
    networks:
      - backend
