# GDPR log marker stack (MAIR-290) for the BFF Message: the services of docker-compose-integration.yml
# (published Message API and Core API images, seeded database, Redis) plus the `gdpr-marker` runner of
# mairie360/CICD (tests/gdpr/marker), which plays gdpr-marker.yaml with a marker user through the BFF.
# gdpr_marker_test.sh then searches the logs of every container (the BFF, its upstream APIs, Postgres,
# Redis) for its values.
#
#   ./gdpr_marker_test.sh                    (local: builds bff-message:local from development.Dockerfile)
#   IMAGE_REF=<image> ./gdpr_marker_test.sh  (CI: the image promoted to staging)
#
# JWT_SECRET and ADMIN_JWT come from stack_secrets.sh (random secret per run, MAIR-428).

volumes:
  postgres-data:
  redis-data:

networks:
  backend:

x-db-env: &db-env
  DB_TYPE: postgres
  DB_NAME: mairie_360_database
  DB_USER: postgres
  DB_PASSWORD: password
  DB_HOST: postgres
  DB_PORT: 5432

services:
  postgres:
    image: ${DB_IMAGE:-ghcr.io/mairie360/database:dev-c5b8e22}
    container_name: bff-message-gdpr-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: mairie_360_database
    expose:
      - "5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    networks:
      - backend
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  liquibase:
    # Database >= MAIR-413 only seeds the template admin (users.id = 1) with -Dallow_template_admin=true.
    image: ${LIQUIBASE_IMAGE:-ghcr.io/mairie360/liquibase-migrations:dev-c5b8e22}
    container_name: bff-message-gdpr-liquibase
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      LIQUIBASE_COMMAND_URL: jdbc:postgresql://postgres:5432/mairie_360_database
      LIQUIBASE_COMMAND_USERNAME: postgres
      LIQUIBASE_COMMAND_PASSWORD: password
      LIQUIBASE_SEARCH_PATH: /migrations
    command: >
      --changelog-file=changelog.xml
      update
      -Dallow_template_admin=true
    networks:
      - backend

  seeder:
    image: postgres:18-alpine
    container_name: bff-message-gdpr-seeder
    depends_on:
      liquibase:
        condition: service_completed_successfully
    volumes:
      - ./init-test.sql:/init-test.sql:ro
    environment:
      PGPASSWORD: password
    command: >
      sh -c "psql -v ON_ERROR_STOP=1 -h postgres -U postgres -d mairie_360_database -f /init-test.sql"
    networks:
      - backend

  redis:
    image: redis:8.4.0-bookworm
    container_name: bff-message-gdpr-redis
    expose:
      - "6379"
    volumes:
      - redis-data:/data
    networks:
      - backend
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  message-api:
    image: ${MESSAGE_API_IMAGE:-ghcr.io/mairie360/message-api:2.1.0}
    container_name: bff-message-gdpr-message-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the journey hammers it as one user.
      RATE_LIMIT_PER_SECOND: "0"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3003
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://message-api:3003
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3003"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): its readiness is probed
    # from the message-api-ready container below.

  message-api-ready:
    image: curlimages/curl:latest
    container_name: bff-message-gdpr-message-api-ready
    depends_on:
      message-api:
        condition: service_started
    # Bounded (3 minutes): an API that never answers fails the stack instead of hanging the run.
    command: >
      sh -c 'for i in $$(seq 90); do
      if curl -fsS http://message-api:3003/health >/dev/null; then echo "message-api ready"; exit 0; fi;
      echo "waiting for message-api..."; sleep 2; done; echo "message-api not ready after 3 minutes"; exit 1'
    networks:
      - backend

  core-api:
    image: ${CORE_API_IMAGE:-ghcr.io/mairie360/core-api:2.2.0}
    container_name: bff-message-gdpr-core-api
    depends_on:
      liquibase:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    environment:
      # Lift the API rate limit (MAIR-425): the journey hammers it as one user.
      RATE_LIMIT_ENABLED: "false"
      # Core refuses to start without its Resend configuration (MAIR-522). No route of this BFF sends an
      # e-mail, so the key is fake and the URL never called.
      RESEND_API_KEY: "re_fake_local"
      RESEND_BASE_URL: "http://fake-resend.invalid"
      EMAIL_DOMAIN: "mairie360.local"
      <<: *db-env
      HOST: "0.0.0.0"
      PORT: 3000
      REDIS_URL: redis://redis:6379
      PUBLIC_URL: http://core-api:3000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
      JWT_TIMEOUT: 3600
    expose:
      - "3000"
    networks:
      - backend
    # The published image is distroless (no shell, no curl): its readiness is probed
    # from the core-api-ready container below.

  core-api-ready:
    image: curlimages/curl:latest
    container_name: bff-message-gdpr-core-api-ready
    depends_on:
      core-api:
        condition: service_started
    # Bounded (3 minutes): an API that never answers fails the stack instead of hanging the run.
    command: >
      sh -c 'for i in $$(seq 90); do
      if curl -fsS http://core-api:3000/health >/dev/null; then echo "core-api ready"; exit 0; fi;
      echo "waiting for core-api..."; sleep 2; done; echo "core-api not ready after 3 minutes"; exit 1'
    networks:
      - backend

  bff-message:
    image: ${IMAGE_REF:-bff-message:local}
    container_name: bff-message-gdpr-bff
    depends_on:
      seeder:
        condition: service_completed_successfully
      message-api-ready:
        condition: service_completed_successfully
      core-api-ready:
        condition: service_completed_successfully
    environment:
      HOST: "0.0.0.0"
      PORT: 4003
      MESSAGE_API_URL: message-api
      MESSAGE_API_PORT: 3003
      CORE_API_URL: core-api
      CORE_API_PORT: 3000
      # Required at start-up (no localhost default). Project API and Calendar API are not part of this
      # stack: GET /business-references answers 200 with both sources `unavailable`. They point at a closed
      # local port, refused at once: an unknown host name would stall every call on DNS resolution.
      PROJECT_API_URL: http://127.0.0.1:9
      CALENDAR_API_URL: http://127.0.0.1:9
      # Verifies the session tokens before any upstream call (bffs-lib requireSession, MAIR-474).
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is generated by stack_secrets.sh, run the matching *_test.sh script}
    expose:
      - "4003"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4003/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 40s

  gdpr-marker:
    image: node:24-bookworm-slim
    container_name: bff-message-gdpr-marker
    user: "${GDPR_UID:-0}:${GDPR_GID:-0}"
    depends_on:
      bff-message:
        condition: service_healthy
    environment:
      # Admin JWT of the run (sub=1, the seeded Admin), signed by stack_secrets.sh with its JWT_SECRET.
      ADMIN_JWT: ${ADMIN_JWT:?ADMIN_JWT is generated by stack_secrets.sh, run gdpr_marker_test.sh}
    volumes:
      - ./cicd-repo/tests/gdpr:/engine:ro
      - ./gdpr-marker.yaml:/journey/gdpr-marker.yaml:ro
      - ./gdpr-report:/report
    command: ["/engine/marker/run.sh"]
    networks:
      - backend
