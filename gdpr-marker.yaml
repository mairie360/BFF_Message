# GDPR log marker journey (MAIR-290), played by mairie360/CICD tests/gdpr/marker.
#
# Messages, group names and descriptions are free text: they carry personal data ("call
# <name> at <phone>"), and so do the contact and conversation searches. The marker's values go
# there, into query strings and into deliberate errors; the logs of every container of
# docker-compose-gdpr-marker.yml (the BFF, Message API, Core API, Postgres, Redis) are then
# searched for them (see gdpr_marker_test.sh). A log describes an error by its type and context,
# never by the value it received.
version: 1
target: http://bff-message:4003
wait: /health
# The admin JWT of the stack (sub=1, the seeded Admin), the same one the ZAP scan uses.
env: [ADMIN_JWT]
steps:
  - name: search the contacts for the marker (query string)
    request: {method: GET, path: "/contacts?search={{marker.last_name}}&limit=10", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
  - name: search the contacts with a refused limit (deliberate error, query string)
    request: {method: GET, path: "/contacts?search={{marker.email}}&limit=0", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [400]
  - name: search the conversations for the marker (query string)
    request: {method: GET, path: "/conversations?search={{marker.first_name}}&limit=10", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
  - name: search the conversations with a refused limit (deliberate error, query string)
    request: {method: GET, path: "/conversations?search={{marker.phone}}&limit={{marker.last_name}}", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [400]
  - name: create a group named after the marker
    request:
      method: POST
      path: /groups
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {name: "Team {{marker.last_name}}", description: "Reach {{marker.first_name}} at {{marker.phone}}", memberIds: [3]}
    expect: [201]
    capture:
      group_id: body.conversation.id
  - name: create a group with a refused name (deliberate error)
    request:
      method: POST
      path: /groups
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {name: "<{{marker.last_name}}>", description: "{{marker.email}}", memberIds: [3]}
    expect: [400]
  - name: send a message holding the marker
    request:
      method: POST
      path: "/conversations/{{group_id}}/messages"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {content: "Hello {{marker.first_name}} {{marker.last_name}}, call {{marker.phone}} or {{marker.email}}"}
    expect: [201]
  - name: send a message with a refused content (deliberate error)
    request:
      method: POST
      path: "/conversations/{{group_id}}/messages"
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {content: "<b>{{marker.email}}</b>"}
    expect: [400]
  - name: send a message to a conversation that does not exist (deliberate error)
    request:
      method: POST
      path: /conversations/999999/messages
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {content: "Hello {{marker.last_name}}, {{marker.phone}}"}
    # Message API 0.7.1 (the stack's) answers 500 there, relayed as 502; newer ones 403 / 404.
    expect: [403, 404, 502]
  - name: read the messages
    request: {method: GET, path: "/conversations/{{group_id}}/messages?limit=20", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
  - name: read the messages with a refused cursor (deliberate error, query string)
    request: {method: GET, path: "/conversations/{{group_id}}/messages?before={{marker.email}}", headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}}
    expect: [400]
  - name: send a direct message holding the marker
    request:
      method: POST
      path: /direct-messages
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {recipientId: 3, message: "Private: {{marker.first_name}} {{marker.last_name}}, {{marker.phone}}"}
    expect: [201]
  - name: send a direct message to a refused recipient (deliberate error)
    request:
      method: POST
      path: /direct-messages
      headers: {Authorization: "Bearer {{env.ADMIN_JWT}}"}
      json: {recipientId: "{{marker.email}}", message: "Private: {{marker.last_name}}"}
    expect: [400]
  - name: read the bootstrap with an invalid token (deliberate error)
    request: {method: GET, path: /messaging/bootstrap, headers: {Authorization: "Bearer {{marker.password}}"}}
    expect: [401]
